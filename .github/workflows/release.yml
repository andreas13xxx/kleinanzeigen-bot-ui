name: Release · Docker Build & Push

on:
  release:
    types: [published]
  # Manual rebuild, and the entry point for bot-watch when a new kleinanzeigen-bot is out.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-image
  cancel-in-progress: false

jobs:
  ci:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  docker-build:
    name: Build, scan & push image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Look up the current kleinanzeigen-bot release
        id: bot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          json=$(gh api repos/Second-Hand-Friends/kleinanzeigen-bot/releases/tags/latest)
          for arch in amd64 arm64; do
            digest=$(jq -r --arg n "kleinanzeigen-bot-linux-${arch}" '.assets[] | select(.name == $n) | .digest' <<<"$json")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::No valid digest for linux-${arch} bot asset (got '${digest}')"
              exit 1
            fi
            echo "${arch}=${digest}" >> "$GITHUB_OUTPUT"
          done

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Prepare Docker context
        # The Dockerfile COPYs these two from the context root (flat NAS export layout).
        run: cp docker/entrypoint.sh docker/nginx.conf .

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=rebuild-{{date 'YYYYMMDD-HHmm'}},enable=${{ github.event_name != 'release' }}

      # Build once for amd64 and scan BEFORE anything is pushed, so a vulnerable image never
      # reaches the registry. The push step below reuses the build cache.
      - name: Build (amd64) for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: kleinanzeigen-bot-ui:scan
          build-args: |
            BOT_SHA256_AMD64=${{ steps.bot.outputs.amd64 }}
            BOT_SHA256_ARM64=${{ steps.bot.outputs.arm64 }}
          cache-from: type=gha,scope=public-release
          cache-to: type=gha,mode=max,scope=public-release

      - name: Scan image (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kleinanzeigen-bot-ui:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

      - name: Push multi-arch image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BOT_SHA256_AMD64=${{ steps.bot.outputs.amd64 }}
            BOT_SHA256_ARM64=${{ steps.bot.outputs.arm64 }}
          # SBOM + provenance are attached as attestations below, not as extra manifests.
          provenance: false
          cache-from: type=gha,scope=public-release
          cache-to: type=gha,mode=max,scope=public-release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
