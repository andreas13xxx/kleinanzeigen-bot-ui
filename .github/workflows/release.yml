name: Release · Docker Build & Push

on:
  # Every push to main runs release-please. It keeps a Release PR open with the next
  # v<upstream>-fork<N+1> version (see "Compute next fork version"). Merging that PR
  # creates the tag and the GitHub release; the image is then built, scanned and pushed.
  push:
    branches: [main]
  # Manual run, and the entry point for bot-watch when a new kleinanzeigen-bot is out.
  # Picks the next free tag v<package.json version>-fork<N> and releases it after the push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-image
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / Release
    # Only a push decides about releases; a manual run just rebuilds the image.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      # Pinned CLI version. The action cannot pass --release-as in manifest mode, so we
      # call the release-please CLI directly.
      RELEASE_PLEASE: release-please@17.11.2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Versions follow upstream: v<upstream>-fork<N>. Conventional Commits must NOT bump
      # the upstream part, so the next version is computed here and forced via --release-as.
      #   manifest 2.77.5-fork10, package.json 2.77.5[-forkN] -> 2.77.5-fork11
      #   package.json moved to a new upstream (e.g. 2.78.0)  -> 2.78.0-fork1
      - name: Compute next fork version
        id: ver
        run: |
          set -euo pipefail
          current=$(jq -r '."."' .release-please-manifest.json)
          cur_base=${current%-fork*}
          cur_n=${current##*-fork}
          pkg_base=$(jq -r .version package.json | sed 's/-fork.*$//')
          [[ "$cur_n" =~ ^[0-9]+$ ]] || { echo "::error::Manifest version '$current' has no -forkN suffix"; exit 1; }
          # Manual / bot-watch runs create fork tags without touching the manifest, so
          # count from the highest existing tag of this base as well.
          last=$(git ls-remote --tags --refs origin "refs/tags/v${pkg_base}-fork*" \
            | sed -n "s|.*refs/tags/v${pkg_base}-fork\([0-9][0-9]*\)\$|\1|p" | sort -n | tail -1)
          n=${last:-0}
          if [ "$pkg_base" = "$cur_base" ] && [ "$cur_n" -gt "$n" ]; then
            n=$cur_n
          fi
          next="${pkg_base}-fork$(( n + 1 ))"
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "Current: ${current}, next: ${next}"

      # After a Release PR merge the manifest holds a version without a tag yet:
      # create tag + GitHub release for it.
      - name: Create release for a merged Release PR
        id: release
        env:
          CURRENT: ${{ steps.ver.outputs.current }}
        run: |
          set -euo pipefail
          tag="v${CURRENT}"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "release_created=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag exists — nothing to release."
            exit 0
          fi
          npx -y "$RELEASE_PLEASE" github-release \
            --token "$GH_TOKEN" --repo-url "$REPO" --target-branch main
          gh release view "$tag" --repo "$REPO" >/dev/null || { echo "::error::release-please did not create $tag"; exit 1; }
          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"

      - name: Open or update the Release PR
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          npx -y "$RELEASE_PLEASE" release-pr \
            --token "$GH_TOKEN" --repo-url "$REPO" --target-branch main \
            --release-as "$NEXT"

  ci:
    name: Quality gate
    needs: release-please
    # always(): release-please is skipped on a manual run, which would skip this job too.
    if: |
      always() && (
        github.event_name == 'workflow_dispatch'
        || needs.release-please.outputs.release_created == 'true'
      )
    uses: ./.github/workflows/ci.yml
    with:
      # This workflow builds and scans the image itself below.
      build-image: "false"

  docker-build:
    name: Build, scan & push image
    needs: [release-please, ci]
    if: |
      always() && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      bot_version: ${{ steps.botver.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Look up the current kleinanzeigen-bot release
        id: bot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          json=$(gh api repos/Second-Hand-Friends/kleinanzeigen-bot/releases/tags/latest)
          for arch in amd64 arm64; do
            digest=$(jq -r --arg n "kleinanzeigen-bot-linux-${arch}" '.assets[] | select(.name == $n) | .digest' <<<"$json")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::No valid digest for linux-${arch} bot asset (got '${digest}')"
              exit 1
            fi
            echo "${arch}=${digest}" >> "$GITHUB_OUTPUT"
          done

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Prepare Docker context
        # The Dockerfile COPYs these two from the context root (flat NAS export layout).
        run: cp docker/entrypoint.sh docker/nginx.conf .

      # One name for the image tag AND the GitHub release: the pushed version tag, or for
      # manual / bot-watch runs the next free v<package.json version>-fork<N>. The `release`
      # concurrency group serializes runs, so two runs cannot pick the same number.
      - name: Release tag
        id: rel
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="${{ needs.release-please.outputs.tag_name }}"
          else
            # package.json may already carry a -forkN suffix from a release PR.
            base=$(jq -r .version package.json | sed 's/-fork.*$//')
            last=$(git ls-remote --tags --refs origin "refs/tags/v${base}-fork*" \
              | sed -n "s|.*refs/tags/v${base}-fork\([0-9][0-9]*\)\$|\1|p" | sort -n | tail -1)
            tag="v${base}-fork$(( ${last:-0} + 1 ))"
          fi
          # Must be a legal Docker tag, since it is used as one.
          [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "::error::'$tag' is not a valid image tag"; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.rel.outputs.tag }}

      # Build once for amd64 and scan BEFORE anything is pushed, so a vulnerable image never
      # reaches the registry. The push step below reuses the build cache.
      - name: Date for apt cache bust
        id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build (amd64) for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: kleinanzeigen-bot-ui:scan
          build-args: |
            BOT_SHA256_AMD64=${{ steps.bot.outputs.amd64 }}
            BOT_SHA256_ARM64=${{ steps.bot.outputs.arm64 }}
            APT_CACHE_BUST=${{ steps.day.outputs.date }}
          cache-from: type=gha,scope=public-release
          cache-to: type=gha,mode=max,scope=public-release

      - name: Read the bundled bot version
        id: botver
        run: |
          set -euo pipefail
          v=$(docker run --rm --entrypoint cat kleinanzeigen-bot-ui:scan /opt/bot-default/VERSION | tr -d '\r\n')
          echo "version=${v}" >> "$GITHUB_OUTPUT"

      - name: Scan image (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kleinanzeigen-bot-ui:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

      - name: Push multi-arch image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BOT_SHA256_AMD64=${{ steps.bot.outputs.amd64 }}
            BOT_SHA256_ARM64=${{ steps.bot.outputs.arm64 }}
            APT_CACHE_BUST=${{ steps.day.outputs.date }}
          # SBOM + provenance are attached as attestations below, not as extra manifests.
          provenance: false
          cache-from: type=gha,scope=public-release
          cache-to: type=gha,mode=max,scope=public-release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false

  # Separate job so only this one gets write access to the repository contents.
  github-release:
    name: Create GitHub release
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create the release (skipped when one already exists)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.docker-build.outputs.tag }}
          BOT: ${{ needs.docker-build.outputs.bot_version }}
          DIGEST: ${{ needs.docker-build.outputs.digest }}
        run: |
          set -euo pipefail
          # A release made by hand already exists by the time this runs (manual run only).
          if [ "$GITHUB_EVENT_NAME" != "push" ] && gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi

          {
            echo "Container image: \`ghcr.io/${REPO}:${TAG}\`"
            echo
            echo "- Bundled kleinanzeigen-bot: \`${BOT}\`"
            echo "- Image digest: \`${DIGEST}\`"
            echo
            echo "Update: \`docker compose pull && docker compose up -d\` (see docker/DEPLOYMENT.md)."
            echo
            echo "Full difference to the original project: [CHANGELOG-FORK.md](https://github.com/${REPO}/blob/${TAG}/CHANGELOG-FORK.md)"
            echo
          } > notes.md

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # release-please made the release; add the image info to its notes.
            gh release view "$TAG" --repo "$REPO" --json body --jq .body > old.md
            cat notes.md old.md > all.md
            gh release edit "$TAG" --repo "$REPO" --notes-file all.md
          else
            # Manual / bot-watch run: create the tag at the built commit together with the release.
            gh release create "$TAG" --repo "$REPO" --target "$GITHUB_SHA" --title "$TAG" \
              --notes-file notes.md --generate-notes
          fi
