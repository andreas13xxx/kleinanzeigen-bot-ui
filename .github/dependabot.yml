version: 2

updates:
  # App dependencies (package.json / package-lock.json)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    groups:
      # One PR for all non-major bumps keeps the review load low; majors stay separate.
      npm-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  # Base images in docker/Dockerfile (node, debian)
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    labels: [dependencies, docker]

  # Versions of the actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    groups:
      actions:
        update-types: [minor, patch]
    labels: [dependencies, ci]
