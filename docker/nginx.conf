worker_processes 1;
events { worker_connections 256; }

http {
  # WebSocket upgrade map (used by the app and noVNC)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # nginx defaults to 1 MB, which rejects phone photos with HTTP 413 before Next.js sees them.
  # The app enforces its own limits (10 MB per image, 20 images per ad), so allow a full batch.
  client_max_body_size 200m;

  server {
    listen 3000;

    # noVNC web client + its WebSocket (websockify on 6080), same-origin so the
    # GUI can embed it in an iframe without cross-origin frame blocks.
    location /bot-browser/ {
      proxy_pass http://127.0.0.1:6080/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 86400s;
    }

    # The Next.js app (internal port 3001).
    location / {
      proxy_pass http://127.0.0.1:3001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 300s;
    }
  }
}
