services:
  kleinanzeigen-bot-ui:
    image: ${IMAGE:-ghcr.io/andreas13xxx/kleinanzeigen-bot-ui}:${IMAGE_TAG:-latest}
    container_name: kleinanzeigen-bot-ui
    restart: unless-stopped
    ports:
      # Port 3000 inside the container is nginx, which fronts the Next.js app
      # (on internal port 3001) and serves noVNC same-origin under /bot-browser/.
      - "${PORT:-3737}:3000"
    volumes:
      - .:/workspace
    environment:
      - BOT_CMD=/workspace/bot/kleinanzeigen-bot
      - BOT_DIR=/workspace
      - TZ=${TZ:-Europe/Berlin}
      # Replace the bot in the volume whenever the image ships a different one (default: true).
      # Set to "false" to keep a manually pinned bot version.
      - BOT_AUTO_SYNC=${BOT_AUTO_SYNC:-true}
      # Stretch every bot timeout on slow hosts (1-10, empty = bot default). Wins over config.yaml.
      - BOT_TIMEOUT_MULTIPLIER=${BOT_TIMEOUT_MULTIPLIER:-}
      # Initial size of the visible browser (Xvnc). Must stay >= 768 px wide, otherwise
      # kleinanzeigen.de serves its mobile layout and the login navigation times out.
      - VNC_GEOMETRY=${VNC_GEOMETRY:-1280x900}
      # Set to "true" only if running behind an HTTPS reverse proxy:
      # - COOKIE_SECURE=true
    shm_size: "512m"
    deploy:
      resources:
        limits:
          memory: 2G
    cap_add:
      - SYS_ADMIN
    tmpfs:
      - /tmp:size=1G,exec
    security_opt:
      - seccomp:unconfined
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/system/ping"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
